[/Script/GameplayAbilities.AbilitySystemGlobals]
; Makes every effect spec carry FARPGGameplayEffectContext (poise, knockback,
; hit-stop, contact point, element) instead of the stock context.
AbilitySystemGlobalsClassName="/Script/ARPGCore.ARPGAbilitySystemGlobals"
; Without this, GAS scans ALL of /Game/ for GameplayCue notifies on every
; startup. Harmless today, progressively slower as content lands -- and the
; startup warning that says so is easy to stop reading. Phase 2's status-effect
; VFX cues are the first things that will live here.
+GameplayCueNotifyPaths="/Game/ARPG/GameplayCues"

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1
