[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=89733872494D08B78BFBE29BE7CB0709
ProjectName=Third Person Game Template

[/Script/GameplayAbilities.AbilitySystemGlobals]
; Makes every effect spec carry FARPGGameplayEffectContext (poise, knockback,
; hit-stop, contact point, element) instead of the stock context.
AbilitySystemGlobalsClassName="/Script/ARPGCore.ARPGAbilitySystemGlobals"
; Without this, GAS scans ALL of /Game/ for GameplayCue notifies on every
; startup. Harmless today, progressively slower as content lands -- and the
; startup warning that says so is easy to stop reading. Phase 2's status-effect
; VFX cues are the first things that will live here.
+GameplayCueNotifyPaths="/Game/ARPG/GameplayCues"

[/Script/ARPGWorld.ARPGWorldSettings]
; The elemental solvers -- reactions, conduction, spread and fluids -- are world
; subsystems, and their configuration was EditAnywhere on the subsystems
; themselves, which have no editing surface at all. Nothing but the automation
; tests ever set them, so a real session ran every solver with no combination
; table and no definitions: inert, silently. See UARPGWorldSettings.
;
; ONE table for all of them. Fire + water is steam in the player's hand, where two
; spells meet, where two media share ground, and where a charge enters a medium.
CombinationTable=/Game/ARPG/Magic/DA_MagicCombinations.DA_MagicCombinations

; What pools, and what it is like frozen. An element absent from these lists
; simply leaves nothing behind when a spell of it lands -- which is the answer
; for fire, air and lightning, and why there is no list of "wet" elements
; anywhere in C++. Generated by Tools/generate_fluid_assets.py.
+FluidDefinitions=/Game/ARPG/Fluids/DA_Fluid_Water.DA_Fluid_Water
+SolidDefinitions=/Game/ARPG/Fluids/DA_Solid_Ice.DA_Solid_Ice

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1
