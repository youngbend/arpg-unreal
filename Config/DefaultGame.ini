[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=89733872494D08B78BFBE29BE7CB0709
ProjectName=Third Person Game Template

[/Script/GameplayAbilities.AbilitySystemGlobals]
; Makes every effect spec carry FARPGGameplayEffectContext (poise, knockback,
; hit-stop, contact point, element) instead of the stock context.
AbilitySystemGlobalsClassName="/Script/ARPGCore.ARPGAbilitySystemGlobals"
; Without this, GAS scans ALL of /Game/ for GameplayCue notifies on every
; startup. Harmless today, progressively slower as content lands -- and the
; startup warning that says so is easy to stop reading. Phase 2's status-effect
; VFX cues are the first things that will live here.
+GameplayCueNotifyPaths="/Game/ARPG/GameplayCues"

[/Script/ARPGWorld.ARPGWorldSettings]
; The elemental solvers -- reactions, conduction, spread and fluids -- are world
; subsystems, and their configuration was EditAnywhere on the subsystems
; themselves, which have no editing surface at all. Nothing but the automation
; tests ever set them, so a real session ran every solver with no combination
; table and no definitions: inert, silently. See UARPGWorldSettings.
;
; ONE table for all of them. Fire + water is steam in the player's hand, where two
; spells meet, where two media share ground, and where a charge enters a medium.
CombinationTable=/Game/ARPG/Magic/DA_MagicCombinations.DA_MagicCombinations

; THE DIFFUSIVE MEDIA. Until these existed the spread subsystem initialised with
; an empty definition list every session -- a legitimate configuration meaning
; "this world has no diffusive media", so it never complained -- and phase 9's
; solver had never run outside its own tests. Generated by
; Tools/generate_spread_assets.py.
+SpreadDefinitions=/Game/ARPG/Spread/DA_Spread_Fire.DA_Spread_Fire

; Placeholder bake: four chunks around the origin, with a stone stripe through
; the middle of chunk (0,0) that fire scores at zero. A chunk with no entry
; falls back to uniformly full fuel, so this only ADDS a firebreak rather than
; making the rest of the world fireproof.
FuelMap=/Game/ARPG/Spread/DA_FuelMap_Placeholder.DA_FuelMap_Placeholder

; What pools, and what it is like frozen. An element absent from these lists
; simply leaves nothing behind when a spell of it lands -- which is the answer
; for fire, air and lightning, and why there is no list of "wet" elements
; anywhere in C++. Generated by Tools/generate_fluid_assets.py.
+FluidDefinitions=/Game/ARPG/Fluids/DA_Fluid_Water.DA_Fluid_Water
+FluidDefinitions=/Game/ARPG/Fluids/DA_Fluid_Lava.DA_Fluid_Lava
+SolidDefinitions=/Game/ARPG/Fluids/DA_Solid_Ice.DA_Solid_Ice

; EARTH IS NOT FROZEN OUT OF ANYTHING. Both of these are raised out of the ground
; by a spell and were never a liquid -- listed here because this is where a slab
; is described, not because a fluid made one. Two of them for one element because
; Burst and Emanate want opposite shapes: a thick pillar to hide behind, and a
; long low wall that breaks a charge.
+SolidDefinitions=/Game/ARPG/Fluids/DA_Solid_EarthSlab.DA_Solid_EarthSlab
+SolidDefinitions=/Game/ARPG/Fluids/DA_Solid_EarthWall.DA_Solid_EarthWall

; And what a lava flow sets into when water hits it. Listed like any other solid
; -- the Quench row in the combination table is the whole of "water quenches
; lava", and this is only what the result is LIKE.
+SolidDefinitions=/Game/ARPG/Fluids/DA_Solid_Obsidian.DA_Solid_Obsidian

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

[/Script/Engine.AssetManagerSettings]
; WHY THIS SECTION EXISTS. Fifteen data-asset classes in Source/ override
; GetPrimaryAssetId(), and until this section landed not one of them was
; registered for scanning. The Asset Manager therefore never discovered them:
; GetPrimaryAssetIdList() returned nothing, async loading by type did not work,
; and all fifteen overrides were dead code. The gap was being filled by hand
; with ini enumerations and hardcoded FSoftObjectPaths in C++.
;
; RECURSIVE FROM /Game/ARPG for every type, rather than one tight directory per
; type. Content here moves between folders as it is authored -- attacks live
; under both Attacks/ and Weapons/sword/Attacks/ today -- and a scan path that
; has to be corrected every time an artist reorganises is a scan path that
; silently stops finding things. The class filter is what actually selects, so
; a wider root costs a little scan time and buys immunity to layout changes.
;
; bHasBlueprintClasses=False throughout: these are all data assets, never
; Blueprint classes derived from one.
+PrimaryAssetTypesToScan=(PrimaryAssetType="ARPGDamageType",AssetBaseClass="/Script/ARPGCore.ARPGDamageTypeAsset",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/ARPG")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="ARPGMagicElement",AssetBaseClass="/Script/ARPGMagic.ARPGMagicElement",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/ARPG")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
