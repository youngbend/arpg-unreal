; ---------------------------------------------------------------------------
; DualSense (PS5) over USB, via the RawInput plugin.
;
; WHY THIS EXISTS. Unreal reads gamepads on Windows through XInput, which only
; covers Xbox-compatible devices. A DualSense enumerates as a plain HID device,
; so without this it is invisible to the engine -- not misbehaving, simply never
; seen. RawInput reads it as a generic HID controller instead.
;
; WHAT YOU GIVE UP versus a real XInput pad: no rumble, no adaptive triggers, no
; light bar, and no automatic button labels. This is input only.
;
; THE INDICES BELOW ARE THE STANDARD DUALSENSE LAYOUT AND MAY NEED CORRECTING.
; Axis order comes from the order the device's HID descriptor happens to declare
; its value caps, which is conventional but not guaranteed. Run the console
; command `ARPGRawInput` in game, move one control at a time, and the log names
; the axis or button that actually moved -- then fix the line here.
;
; Buttons are mapped straight through (HID button N -> Button N) rather than
; renamed to their PlayStation faces, so what this file says matches what the
; debug command prints. The semantic mapping -- which face button means "heavy
; attack" -- lives in IMC_ARPG, where the rest of the scheme is.
;
;   Button1  Square      Button6  R1          Button11 L3
;   Button2  Cross       Button7  L2          Button12 R3
;   Button3  Circle      Button8  R2          Button13 PS
;   Button4  Triangle    Button9  Create      Button14 Touchpad
;   Button5  L1          Button10 Options     Button15 Mute
;
; Sticks use bGamepadStick so they re-centre to -1..1; the triggers do not,
; because a trigger genuinely rests at zero. Y axes are inverted because HID
; reports screen-down as positive and the game wants forward positive.
;
; THE HAT'S OFFSET IS LOAD-BEARING, not padding. The D-pad is a single 8-way
; value, and its "north" reading is exactly 0 -- which Enhanced Input treats as
; "not pressed", so up would never fire. Shifting every reading by 0.1 makes
; each of the nine states a distinct non-zero value. UARPGModalInputComponent
; subtracts it again when decoding.
[/Script/RawInput.RawInputSettings]
