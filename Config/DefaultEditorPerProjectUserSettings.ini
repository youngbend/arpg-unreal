[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; Unreal's built-in MCP *server*, which exposes the running editor to an MCP
; client. bAutoStartServer defaults to false, so enabling the plugin alone
; leaves nothing listening -- this is the line that actually brings it up, on
; http://localhost:8000/mcp after the next editor restart.
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
bEnableToolSearch=True